# compound-engineering — Every Inc.'s Compound Engineering methodology as a
# Gas City build factory, with capability tiers for its agents.
#
# Inherits gascity-packs' compound-engineering pack: the compound-build
# formula, its plan-review and code-review loops, and 28 ce-* agents. It
# assigns each agent a capability tier and effort. The tier vocabulary comes
# from the provider blocks in the `house` pack, and the formulas also route to
# gc's worker roles, so a city composes this with `gc`, `bd` and `house`.
#
# Import it at city scope and bind it as `compound-engineering`:
#
#   [imports.compound-engineering]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/compound-engineering"
#
# The binding is not cosmetic. The upstream formulas route every lane to
# `compound-engineering.ce-*` by name, so any other binding leaves all 28
# routes pointing at agents that do not exist. Inside this pack the upstream
# pack keeps that same binding.
#
# Every ce-* agent is declared scope = "rig" upstream, so this one city-level
# import expands them across every rig. No rig-level import is needed.

[pack]
name = "compound-engineering-tiered"
version = "0.11.0"
schema = 2
description = "Compound Engineering as a Gas City build factory, with a capability tier for every agent."

# ── inherited pack ─────────────────────────────────────────────────────
# Move the pin with `gc import upgrade`, not by hand.
#
# Pinned to rileywhite/gascity-packs b7318e5, the same commit as the gascity
# import in the `gc` pack: upstream main 0f07496 plus one fix. Upstream's
# compound formulas point their check gates at `.gc/scripts/checks/`, which
# nothing populates in a running city, so the review and plan-review loops are
# quarantined with control_dispatch_error and their lanes never run. The fork
# uses the layer-resolved `../assets/scripts/checks/` form instead, which gc
# resolves to the gascity layer's scripts. Return to upstream once the fix
# merges there; see README.md, "Upstream fix". Upstream compound-engineering imports gascity itself, by a
# relative path, so its gascity resolves at whatever commit this pin names.
# Sharing the commit keeps a single gascity in the city. ALWAYS move this pin
# and the `gc` pack's gascity pins together.

[imports.compound-engineering]
source = "https://github.com/rileywhite/gascity-packs/tree/compound-check-asset-paths/compound-engineering"
version = "sha:b7318e50985a07ffce376abd183a2b5ccdeef82e"

# ── agent tiers ────────────────────────────────────────────────────────
# Each tier names a kind of agent (see the `house` pack): operators run
# defined procedures, engineers plan, build and review, and principals set
# the direction everything else follows. Effort then sets how much care each
# one spends.

# ── principals ─────────────────────────────────────────────────────────
# These decide what gets built and how it is shaped. A weak requirement or
# plan is reviewed, decomposed and implemented faithfully, so its mistakes
# cost every later stage. They run once per build, or once per plan-review
# pass, which is what makes the top tier affordable for them. The
# architecture strategist is the plan reviewer whose whole job is structure,
# so it sits with the planner it reviews.
#
# The brainstormer and planner work with a person in the loop in interactive
# mode, so they run at medium. Top-tier models think longer per turn and take
# more initiative; at medium the turns stay short and the questions stay on
# what was asked. Anthropic notes that lower effort on its top tier often
# beats prior models at their highest. The plan-review scope guardian also
# checks every plan for scope creep. The strategist works alone, so it keeps
# high.
[[patches.agent]]
name = "ce-brainstorm"
option_defaults = { model = "principal", effort = "medium" }

[[patches.agent]]
name = "ce-plan"
option_defaults = { model = "principal", effort = "medium" }

[[patches.agent]]
name = "ce-architecture-strategist"
option_defaults = { model = "principal", effort = "high" }

# ── engineers: plan review ─────────────────────────────────────────────
# The rest of the panel that must approve the plan before any code exists.
[[patches.agent]]
name = "ce-coherence-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-feasibility-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-scope-guardian-reviewer"
option_defaults = { model = "engineer", effort = "high" }

# ── engineers: implementation ──────────────────────────────────────────
# Writes each drained item and applies review fixes: the counterpart of gc's
# implementation-worker, tiered the same way. xhigh follows Anthropic's effort
# guidance for long-running agentic coding with large token budgets.
[[patches.agent]]
name = "ce-work"
option_defaults = { model = "engineer", effort = "xhigh" }

# ── engineers: review lanes that catch defects ─────────────────────────
# A miss in any of these ships a bug, a vulnerability or an outage. Most are
# conditional: the selector runs them only when the change touches their
# area.
[[patches.agent]]
name = "ce-correctness-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-testing-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-security-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-reliability-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-performance-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-data-migration-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-api-contract-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-adversarial-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-julik-frontend-races-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-swift-ios-reviewer"
option_defaults = { model = "engineer", effort = "high" }

[[patches.agent]]
name = "ce-deployment-verification-agent"
option_defaults = { model = "engineer", effort = "high" }

# ── engineers: review lanes for design quality ─────────────────────────
# Maintainability and agent-native parity are judgment calls about design,
# not checks against a written rule, so they are engineers. A miss costs
# design debt rather than a defect, and both run on every review pass, so
# they spend medium effort rather than the defect lanes' high.
[[patches.agent]]
name = "ce-maintainability-reviewer"
option_defaults = { model = "engineer", effort = "medium" }

[[patches.agent]]
name = "ce-agent-native-reviewer"
option_defaults = { model = "engineer", effort = "medium" }

# ── engineers: synthesis and resolution ────────────────────────────────
# These consolidate verdicts the lanes already reasoned out, so they stay
# engineers but not at the lanes' effort, matching gc's review-synthesizer.
[[patches.agent]]
name = "ce-plan-review-synthesizer"
option_defaults = { model = "engineer", effort = "medium" }

[[patches.agent]]
name = "ce-code-review-synthesizer"
option_defaults = { model = "engineer", effort = "medium" }

[[patches.agent]]
name = "ce-pr-comment-resolver"
option_defaults = { model = "engineer", effort = "medium" }

[[patches.agent]]
name = "ce-compound"
option_defaults = { model = "engineer", effort = "medium" }

# ── operators ──────────────────────────────────────────────────────────
# These run a defined procedure. Project standards and previous comments
# check the change against something already written down: the project's
# conventions, or earlier review comments. The selector decides which
# conditional lanes run; a wrong skip silently drops a lane such as security,
# so it is an operator rather than a custodian, the same reasoning gc applies
# to its control dispatcher. The learnings researcher retrieves past findings
# to feed each review; it gathers rather than judges.
[[patches.agent]]
name = "ce-project-standards-reviewer"
option_defaults = { model = "operator", effort = "medium" }

[[patches.agent]]
name = "ce-previous-comments-reviewer"
option_defaults = { model = "operator", effort = "medium" }

[[patches.agent]]
name = "ce-code-review-selector"
option_defaults = { model = "operator", effort = "medium" }

[[patches.agent]]
name = "ce-learnings-researcher"
option_defaults = { model = "operator", effort = "medium" }
