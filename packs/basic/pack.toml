# ── agent tiers ────────────────────────────────────────────────────────
# The split is by the kind of work, not by how often the agent runs.
# Agents that execute a defined procedure stay cheap. Agents that decide
# what to build, or judge whether the result is acceptable, do not.

# mechanical: polls, sweeps, routes. Nothing here forms a judgment.
[[patches.agent]]
name = "dog"
option_defaults = { model = "light", effort = "low" }

# Routing control beads is mechanical, but a wrong route stalls a run, so
# it sits a tier above the dog.
[[patches.agent]]
name = "control-dispatcher"
option_defaults = { model = "standard", effort = "low" }

# Deterministic setup, validation, gates, metadata, finalization.
[[patches.agent]]
name = "run-operator"
option_defaults = { model = "standard", effort = "low" }

# Authorized pushes, PR creation, publication surfaces.
[[patches.agent]]
name = "publisher"
option_defaults = { model = "standard", effort = "low" }

# Classification against supplied evidence: bounded, but not clerical.
[[patches.agent]]
name = "issue-triager"
option_defaults = { model = "standard", effort = "medium" }

# judgment: these decide what the work is, how to build it, or whether the
# result passes. A bad call here costs far more than the tokens saved.
[[patches.agent]]
name = "mayor"
option_defaults = { model = "deep", effort = "high" }

[[patches.agent]]
name = "task-decomposer"
option_defaults = { model = "deep", effort = "high" }

[[patches.agent]]
name = "requirements-planner"
option_defaults = { model = "deep", effort = "high" }

[[patches.agent]]
name = "design-author"
option_defaults = { model = "deep", effort = "high" }

[[patches.agent]]
name = "design-implementation-reviewer"
option_defaults = { model = "deep", effort = "high" }

[[patches.agent]]
name = "design-test-risk-reviewer"
option_defaults = { model = "deep", effort = "high" }

[[patches.agent]]
name = "implementation-reviewer"
option_defaults = { model = "deep", effort = "high" }

# Finding what is absent is harder than checking what is present.
[[patches.agent]]
name = "gap-analyst"
option_defaults = { model = "deep", effort = "high" }

# Aggregates verdicts the reviewers already reasoned out, so it keeps the
# deep tier for judgment but does not need the reviewers' effort budget.
[[patches.agent]]
name = "review-synthesizer"
option_defaults = { model = "deep", effort = "medium" }

# Writes the actual code, runs the tests, repairs CI.
[[patches.agent]]
name = "implementation-worker"
option_defaults = { model = "deep", effort = "high" }

# Scoped to the city for the same reason the mayor agent is: without it the
# session is expanded per rig and then disabled, because its city-scoped
# template does not exist at rig scope.
[[named_session]]
template = "mayor"
mode = "always"
scope = "city"
