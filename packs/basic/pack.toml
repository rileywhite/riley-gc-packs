# basic — one import that composes a working Gas City.
#
# Pulls in the packs a city normally imports by hand (bd, core, gascity and
# the gascity worker roles), defines a mayor, and tunes every agent by
# capability class rather than by a hardcoded model name.
#
# Import it at city scope and bind it as `gc`:
#
#   [imports.gc]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/basic"
#
# That single import covers both agent scopes. The mayor and dog stay at the
# city; the worker agents are declared scope = "rig" upstream, so the loader
# expands them across every rig and binds each copy to that rig's working
# tree. No rig-level import is needed.
#
# PROVIDER AGNOSTIC. Agents below never name a model. They select a tier —
# frontier, deep, standard or light — which each provider block maps to its
# own model. The same pack therefore runs on Claude Code, Codex or Gemini
# without edits, and a city that switches providers keeps its cost shape.

[pack]
name = "basic"
version = "0.1.0"
schema = 2
description = "Composed Gas City baseline: bd + core + gascity + worker roles, a mayor, and provider-agnostic capability tiers."

# ── composed packs ─────────────────────────────────────────────────────
# Pinned to the commits this configuration was exercised against. Move a
# pin with `gc import upgrade`, not by hand.

[imports.bd]
source = "https://github.com/gastownhall/gascity/tree/main/examples/bd"
version = "sha:f895c0ff47d6ee9334ed282a416387eb5b084d24"

[imports.core]
source = "https://github.com/gastownhall/gascity/tree/main/internal/bootstrap/packs/core"
version = "sha:f895c0ff47d6ee9334ed282a416387eb5b084d24"

[imports.gascity]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[imports.roles]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

# ── capability tiers ───────────────────────────────────────────────────
# Four portable names, mapped per provider below.
#
#   frontier  the specialist top end     fable-5.1 / gpt-6-astra   / 3.1-pro-preview
#   deep      heavyweight reasoning      opus-5    / gpt-5.6-sol   / 3.1-pro-preview
#   standard  the workhorse              sonnet-5  / gpt-5.6-terra / 3.8-flash
#   light     cheap and quick            haiku-4.5 / gpt-5.6-luna  / 3.8-flash
#
# Model ids here are current as of 2026-09-12 and deliberately go past what
# gascity 1.4.1 knows. Its builtin table predates Fable 5.1 (2026-09-01) and
# GPT-6 Astra (2026-09-03), and its Gemini entries still stop at 2.5. That is
# fine: flag_args reach the CLI verbatim, so this schema is not bounded by
# gascity's catalogue. Two consequences worth knowing.
#
# Gemini has no stable Pro model right now. gemini-3-pro-preview is shut
# down, gemini-2.5-pro shuts down 2026-10-16, and 3.1 Pro is still a preview
# endpoint — so both Gemini judgment tiers ride a preview id until Google
# promotes one. Gemini still collapses four tiers into two, and the split
# preserves the COST SHAPE rather than the absolute quality level: judgment
# agents get Pro, mechanical agents get Flash. Mapping `standard` onto Pro
# would have made the mechanical agents the expensive ones.
#
# frontier also carries external version requirements: Codex CLI 0.153.1+
# for Astra, and a Gemini CLI new enough for 3.1 Pro.
#
# Nothing is mapped to `frontier` yet; it exists so a city can opt one agent
# up without inventing vocabulary.
#
# Effort uses one vocabulary too: low, medium, high, xhigh, max. Codex tops
# out at xhigh and clamps max onto it — gpt-6-astra itself accepts max, but
# the effort option is provider-wide and gpt-5.6-terra and luna are not,
# so the clamp holds to the weakest model in the set. Gemini CLI has no
# reasoning-effort
# control at all, so the option is declared but inert there — declaring it
# keeps a portable agent config from failing to load under Gemini.
#
# There is deliberately NO speed/fast-mode option. No CLI among the three
# exposes one: Claude Code has no --fast flag, Codex expresses speed only
# through model choice, Gemini likewise. A declared-but-inert speed option
# would look like a control and silently do nothing, so it is left out until
# a provider gives it a real surface.

# ── claude ─────────────────────────────────────────
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
options_schema_merge = "by_key"
option_defaults = { model = "standard", effort = "medium" }

# model: four portable tiers, then this provider's own current values.
# Prior-generation 4.x entries are intentionally gone: the current
# self-serve lineup is Fable 5.1, Opus 5, Sonnet 5 and Haiku 4.5.
[[providers.claude.options_schema]]
key = "model"
label = "Model tier"
type = "select"
default = "standard"

[[providers.claude.options_schema.choices]]
value = "frontier"
label = "Frontier"
flag_args = ["--model", "claude-fable-5-1"]

[[providers.claude.options_schema.choices]]
value = "deep"
label = "Deep"
flag_args = ["--model", "claude-opus-5"]

[[providers.claude.options_schema.choices]]
value = "standard"
label = "Standard"
flag_args = ["--model", "claude-sonnet-5"]

[[providers.claude.options_schema.choices]]
value = "light"
label = "Light"
flag_args = ["--model", "claude-haiku-4-5-20251001"]

# passthrough: pin an exact model instead of a tier

[[providers.claude.options_schema.choices]]
value = "fable-5-1"
label = "Fable 5.1"
flag_args = ["--model", "claude-fable-5-1"]

[[providers.claude.options_schema.choices]]
value = "fable-5"
label = "Fable 5"
flag_args = ["--model", "claude-fable-5"]

[[providers.claude.options_schema.choices]]
value = "opus-5"
label = "Opus 5"
flag_args = ["--model", "claude-opus-5"]

[[providers.claude.options_schema.choices]]
value = "opus-5-1m"
label = "Opus 5 1M"
flag_args = ["--model", "claude-opus-5[1m]"]

[[providers.claude.options_schema.choices]]
value = "sonnet-5"
label = "Sonnet 5"
flag_args = ["--model", "claude-sonnet-5"]

[[providers.claude.options_schema.choices]]
value = "haiku"
label = "Haiku 4.5"
flag_args = ["--model", "claude-haiku-4-5-20251001"]

[[providers.claude.options_schema]]
key = "effort"
label = "Effort"
type = "select"
default = "medium"

[[providers.claude.options_schema.choices]]
value = "low"
label = "Low"
flag_args = ["--effort", "low"]

[[providers.claude.options_schema.choices]]
value = "medium"
label = "Medium"
flag_args = ["--effort", "medium"]

[[providers.claude.options_schema.choices]]
value = "high"
label = "High"
flag_args = ["--effort", "high"]

[[providers.claude.options_schema.choices]]
value = "xhigh"
label = "Xhigh"
flag_args = ["--effort", "xhigh"]

[[providers.claude.options_schema.choices]]
value = "max"
label = "Max"
flag_args = ["--effort", "max"]

