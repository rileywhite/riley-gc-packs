# ── gemini ─────────────────────────────────────────
[providers.gemini]
base = "builtin:gemini"
options_schema_merge = "by_key"
option_defaults = { model = "standard", effort = "medium" }

# model: four portable tiers, then this provider's own current values.
# The 2.5 entries are intentionally gone: gemini-2.5-pro shuts down
# 2026-10-16, and gemini-3-pro-preview is already shut down.
[[providers.gemini.options_schema]]
