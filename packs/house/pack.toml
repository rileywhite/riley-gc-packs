# house — house style for a Gas City: capability tiers and a mayor.
#
# The shared layer composed alongside the packs a city inherits. It defines
# the provider-agnostic tier vocabulary those packs' agent patches select
# from, the city's mayor, and any ways of working the city wants on top of
# upstream. It imports no other pack, so it composes with any set of them.
#
# Import it at city scope next to the packs it tunes:
#
#   [imports.gc]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/gc"
#
#   [imports.bd]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/bd"
#
#   [imports.house]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/house"
#
# PROVIDER AGNOSTIC. No agent names a model. Agents select a tier — frontier,
# deep, standard or light — which each provider block maps to its own model.
# The same packs therefore run on Claude Code, Codex or Gemini without edits,
# and a city that switches providers keeps its cost shape.

[pack]
name = "house"
version = "0.4.0"
schema = 2
description = "House style for a Gas City: provider-agnostic capability tiers and a mayor."

# ── capability tiers ───────────────────────────────────────────────────
# Four portable names, mapped per provider below.
#
#   frontier  the specialist top end     fable-5.1 / gpt-6-astra  / 4-argon
#   deep      heavyweight reasoning      opus-5.5  / gpt-6.1-sol  / 3.8-flash
#   standard  the workhorse              sonnet-5.5/ gpt-6.1-sol  / 3.8-flash
#   light     cheap and quick            haiku-5.5 / gpt-6-luna   / 3.5-flash-lite
#
# Model ids are current as of 2026-10-20.
#
# Codex deliberately maps deep AND standard to the same model. GPT-6 has no
# Terra, so there is no mid model to point standard at, and demoting it to
# Luna would have put the workhorse agents on the high-volume model. Instead
# the two tiers share GPT-6.1 Sol and differentiate on EFFORT, which the agent
# patches in packs/gc and packs/bd set: standard agents run low or medium,
# deep agents run high. OpenAI recommends 6.1 Sol over Astra for coding and agentic work
# on cost grounds, so the frontier tier stays the deliberate opt-in.
#
# Gemini reserves Gemini 4 Argon, its flagship reasoning model, for frontier
# only, and runs deep and standard on 3.8 Flash, which Google builds for
# long-horizon software engineering. Light drops to 3.5 Flash-Lite, the
# high-throughput option; Google names those two Flash models together as its
# current pair for new projects. Argon being stable also retires this pack's
# long-standing caveat that Gemini had no stable top model.
#
# NOTE the asymmetry: on Gemini, deep and standard resolve to the same model
# AND effort is inert there, so those two tiers behave identically. Codex gets
# away with sharing a model because effort still separates its tiers. Under
# Gemini, raising an agent from standard to deep changes nothing - move it to
# frontier to get more capability.
#
# frontier still carries an external version requirement: a Codex CLI new
# enough for GPT-6 Astra.
#
# Nothing is mapped to `frontier` yet; it exists so a city can opt one agent
# up without inventing vocabulary.
#
# Effort uses one vocabulary too: low, medium, high, xhigh, max. Codex tops
# out at xhigh and clamps max onto it — gpt-6-astra itself accepts max, but
# the effort option is provider-wide and gpt-5.6-terra and luna are not,
# so the clamp holds to the weakest model in the set. Gemini CLI has no
# reasoning-effort
# control at all, so the option is declared but inert there — declaring it
# keeps a portable agent config from failing to load under Gemini.
#
# There is deliberately NO speed/fast-mode option. No CLI among the three
# exposes one: Claude Code has no --fast flag, Codex expresses speed only
# through model choice, Gemini likewise. A declared-but-inert speed option
# would look like a control and silently do nothing, so it is left out until
# a provider gives it a real surface.

# ── claude ─────────────────────────────────────────
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
options_schema_merge = "by_key"
option_defaults = { model = "standard", effort = "medium" }

# model: four portable tiers, then this provider's own current values.
# Prior-generation 4.x entries are intentionally gone: the current
# self-serve lineup is Fable 5.1, Opus 5, Sonnet 5 and Haiku 4.5.
[[providers.claude.options_schema]]
key = "model"
label = "Model tier"
type = "select"
default = "standard"

[[providers.claude.options_schema.choices]]
value = "frontier"
label = "Frontier"
flag_args = ["--model", "claude-fable-5-1"]

[[providers.claude.options_schema.choices]]
value = "deep"
label = "Deep"
flag_args = ["--model", "claude-opus-5-5"]

[[providers.claude.options_schema.choices]]
value = "standard"
label = "Standard"
flag_args = ["--model", "claude-sonnet-5-5"]

[[providers.claude.options_schema.choices]]
value = "light"
label = "Light"
flag_args = ["--model", "claude-haiku-5-5"]

# passthrough: pin an exact model instead of a tier

[[providers.claude.options_schema.choices]]
value = "fable-5-1"
label = "Fable 5.1"
flag_args = ["--model", "claude-fable-5-1"]

[[providers.claude.options_schema.choices]]
value = "fable-5"
label = "Fable 5"
flag_args = ["--model", "claude-fable-5"]

[[providers.claude.options_schema.choices]]
value = "opus-5-5"
label = "Opus 5.5"
flag_args = ["--model", "claude-opus-5-5"]

[[providers.claude.options_schema.choices]]
value = "opus-5"
label = "Opus 5"
flag_args = ["--model", "claude-opus-5"]

[[providers.claude.options_schema.choices]]
value = "opus-5-1m"
label = "Opus 5 1M"
flag_args = ["--model", "claude-opus-5[1m]"]

[[providers.claude.options_schema.choices]]
value = "sonnet-5-5"
label = "Sonnet 5.5"
flag_args = ["--model", "claude-sonnet-5-5"]

[[providers.claude.options_schema.choices]]
value = "sonnet-5"
label = "Sonnet 5"
flag_args = ["--model", "claude-sonnet-5"]

[[providers.claude.options_schema.choices]]
value = "haiku-5-5"
label = "Haiku 5.5"
flag_args = ["--model", "claude-haiku-5-5"]

[[providers.claude.options_schema.choices]]
value = "haiku-4-5"
label = "Haiku 4.5"
flag_args = ["--model", "claude-haiku-4-5"]

[[providers.claude.options_schema]]
key = "effort"
label = "Effort"
type = "select"
default = "medium"

[[providers.claude.options_schema.choices]]
value = "low"
label = "Low"
flag_args = ["--effort", "low"]

[[providers.claude.options_schema.choices]]
value = "medium"
label = "Medium"
flag_args = ["--effort", "medium"]

[[providers.claude.options_schema.choices]]
value = "high"
label = "High"
flag_args = ["--effort", "high"]

[[providers.claude.options_schema.choices]]
value = "xhigh"
label = "Xhigh"
flag_args = ["--effort", "xhigh"]

[[providers.claude.options_schema.choices]]
value = "max"
label = "Max"
flag_args = ["--effort", "max"]

# ── codex ─────────────────────────────────────────
[providers.codex]
base = "builtin:codex"
options_schema_merge = "by_key"
option_defaults = { model = "standard", effort = "medium" }

# model: four portable tiers, then this provider's own current values.
# gpt-5.2, gpt-5.3-codex, gpt-5.4 and gpt-5.4-mini are intentionally
# gone: all are retired or deprecated for Codex with ChatGPT sign-in.
[[providers.codex.options_schema]]
key = "model"
label = "Model tier"
type = "select"
default = "standard"

[[providers.codex.options_schema.choices]]
value = "frontier"
label = "Frontier"
flag_args = ["--model", "gpt-6-astra"]

[[providers.codex.options_schema.choices]]
