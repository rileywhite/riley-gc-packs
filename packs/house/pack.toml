# house — house style for a Gas City: capability tiers and a mayor.
#
# The shared layer composed alongside the packs a city inherits. It defines
# the provider-agnostic tier vocabulary those packs' agent patches select
# from, the city's mayor, and any ways of working the city wants on top of
# upstream. It imports no other pack, so it composes with any set of them.
#
# Import it at city scope next to the packs it tunes:
#
#   [imports.gc]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/gc"
#
#   [imports.bd]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/bd"
#
#   [imports.house]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/house"
#
# PROVIDER AGNOSTIC. No agent names a model. Agents select a tier — frontier,
# deep, standard or light — which each provider block maps to its own model.
# The same packs therefore run on Claude Code, Codex or Gemini without edits,
# and a city that switches providers keeps its cost shape.

[pack]
name = "house"
version = "0.6.0"
schema = 2
description = "House style for a Gas City: provider-agnostic capability tiers and a mayor."

# ── capability tiers ───────────────────────────────────────────────────
# Four portable names, mapped per provider below.
#
#   frontier  the specialist top end     fable-5.2 / gpt-6-astra   / 3.1-pro-preview
#   deep      heavyweight reasoning      opus-5.5  / gpt-6.1-sol   / 3.8-flash
#   standard  the workhorse              sonnet-5.5/ gpt-6.1-terra / 3.8-flash
#   light     cheap and quick            haiku-5.5 / gpt-6-luna    / 3.5-flash-lite
#
# Model ids are current as of 2026-11-14.
#
# Codex has a distinct model per tier again. GPT-6.1 Terra restores a mid
# model for standard; earlier versions shared GPT-6.1 Sol between deep and
# standard because no Terra existed in the GPT-6 family. OpenAI positions
# Terra for writing, visual understanding and computer use rather than coding,
# so it suits the publisher's PR writing better than the dispatcher's routing.
# Terra needs Codex CLI 0.159.0 or later.
#
# Gemini maps only to models Gemini CLI documents. Google says Gemini CLI "has
# not been optimized for Gemini 4" and points Gemini 4 users to Antigravity
# CLI, and no Gemini CLI page confirms the Gemini 4 models work there. So the
# Gemini 4 family (Carbon, Argon, Hydrogen) is kept as passthrough values a
# city can pin, but no tier resolves to it. Frontier falls back to 3.1 Pro,
# still a preview endpoint. Revisit when Gemini CLI documents Gemini 4.
#
# NOTE the asymmetry: on Gemini, deep and standard resolve to the same model
# AND effort is inert there, so those two tiers behave identically. Under
# Gemini, raising an agent from standard to deep changes nothing - move it to
# frontier to get more capability.
#
# frontier carries an external version requirement on Codex: a CLI new enough
# for GPT-6 Astra.
#
# Nothing is mapped to `frontier` yet; it exists so a city can opt one agent
# up without inventing vocabulary.
#
# Effort uses one vocabulary too: low, medium, high, xhigh, max. Every level
# now maps to a real setting on Claude Code and Codex; Codex previously clamped
# max onto xhigh, but max is a real Codex level on every GPT-6 model, Luna
# included. Codex also has an "ultra" level above max, which this vocabulary
# deliberately does not expose: it fans work out to subagents rather than
# reasoning harder, Luna rejects it, and neither other provider has an
# equivalent, so a portable agent config set to ultra would break elsewhere.
#
# Gemini CLI has no per-invocation thinking control: its thinking level lives
# only in settings.json model configs. The option is declared but inert there,
# which keeps a portable agent config from failing to load under Gemini.
#
# There is deliberately NO speed/fast-mode option. No CLI among the three
# exposes one: Claude Code has no --fast flag, Codex expresses speed only
# through model choice, Gemini likewise. A declared-but-inert speed option
# would look like a control and silently do nothing, so it is left out until
# a provider gives it a real surface.

# ── claude ─────────────────────────────────────────
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
options_schema_merge = "by_key"
option_defaults = { model = "standard", effort = "medium" }

# model: four portable tiers, then this provider's own current values.
# Prior-generation 4.x entries are intentionally gone: the current
# self-serve lineup is Fable 5.1, Opus 5, Sonnet 5 and Haiku 4.5.
[[providers.claude.options_schema]]
key = "model"
label = "Model tier"
type = "select"
default = "standard"

[[providers.claude.options_schema.choices]]
value = "frontier"
label = "Frontier"
flag_args = ["--model", "claude-fable-5-2"]

[[providers.claude.options_schema.choices]]
value = "deep"
label = "Deep"
flag_args = ["--model", "claude-opus-5-5"]

[[providers.claude.options_schema.choices]]
value = "standard"
label = "Standard"
flag_args = ["--model", "claude-sonnet-5-5"]

[[providers.claude.options_schema.choices]]
value = "light"
label = "Light"
flag_args = ["--model", "claude-haiku-5-5"]

# passthrough: pin an exact model instead of a tier

[[providers.claude.options_schema.choices]]
value = "fable-5-2"
label = "Fable 5.2"
flag_args = ["--model", "claude-fable-5-2"]

[[providers.claude.options_schema.choices]]
value = "fable-5-1"
label = "Fable 5.1"
flag_args = ["--model", "claude-fable-5-1"]

[[providers.claude.options_schema.choices]]
value = "fable-5"
label = "Fable 5"
flag_args = ["--model", "claude-fable-5"]

[[providers.claude.options_schema.choices]]
