# ── agent tiers ────────────────────────────────────────────────────────
# Each inherited pack tiers its own agents (see packs/gc and packs/bd). This
# pack tiers only the agents it defines.

# judgment: decides what the work is and how to build it.
[[patches.agent]]
name = "mayor"
option_defaults = { model = "deep", effort = "high" }

# Scoped to the city for the same reason the mayor agent is: without it the
# session is expanded per rig and then disabled, because its city-scoped
# template does not exist at rig scope.
[[named_session]]
template = "mayor"
mode = "always"
scope = "city"
