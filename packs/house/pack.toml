# house — house style for a Gas City: capability tiers and a mayor.
#
# The shared layer composed alongside the packs a city inherits. It defines
# the provider-agnostic tier vocabulary those packs' agent patches select
# from, the city's mayor, and any ways of working the city wants on top of
# upstream. It imports no other pack, so it composes with any set of them.
#
# Import it at city scope next to the packs it tunes:
#
#   [imports.gc]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/gc"
#
#   [imports.bd]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/bd"
#
#   [imports.house]
#   source = "https://github.com/rileywhite/riley-gc-packs.git//packs/house"
#
# PROVIDER AGNOSTIC. No agent names a model. Agents select a tier — principal,
# engineer, operator or custodian — which each provider block maps to its own
# model.
# The same packs therefore run on Claude Code, Codex or Gemini without edits,
# and a city that switches providers keeps its cost shape.

[pack]
name = "house"
version = "0.10.0"
schema = 2
description = "House style for a Gas City: provider-agnostic capability tiers and a mayor."

# ── capability tiers ───────────────────────────────────────────────────
# Four portable names, mapped per provider below. Each names the kind of agent
# the tier is for, so a new agent is placed by asking what kind of agent it
# is, not how big a model it needs.
#
#   principal  sets the direction everything     fable-5.2  / gpt-6.2-astra / 3.1-pro-preview
#              downstream builds on
#   engineer   plans, builds and reviews work    opus-5.5   / gpt-6.2-sol   / 3.8-flash
#   operator   runs a defined procedure          sonnet-5.5 / gpt-6.1-terra / 3.8-flash
#   custodian  keeps things running unattended   haiku-5.5  / gpt-6-luna    / 3.5-flash-lite
#
# Model ids are current as of 2026-11-21.
#
# A principal is an agent whose output everything downstream implements and
# which runs rarely, typically once per build. Both conditions matter: the
# first makes its mistakes the most expensive, and the second keeps the top
# tier affordable. Principals that work with a person in the loop run at
# medium effort, because top-tier models think longer per turn and take more
# initiative.
#
# Codex has a distinct model per tier. OpenAI positions GPT-6.1 Terra for
# writing, visual understanding and computer use rather than coding, so it
# suits the publisher's PR writing better than the dispatcher's routing.
# Terra needs Codex CLI 0.159.0 or later; principal and engineer need 0.171.0
# or later, the first release with GPT-6.2 Astra and Sol in its catalog.
#
# Gemini maps only to models Gemini CLI documents. Google says Gemini CLI "has
# not been optimized for Gemini 4" and points Gemini 4 users to Antigravity
# CLI, and no Gemini CLI page confirms the Gemini 4 models work there. So no
# Gemini 4 model is offered, not even as a passthrough value. Principal falls
# back to 3.1 Pro, still a preview endpoint. Revisit when Gemini CLI documents
# Gemini 4.
#
# NOTE the asymmetry: on Gemini, engineer and operator resolve to the same
# model AND effort is inert there, so those two tiers behave identically.
# Under Gemini, moving an agent from operator to engineer changes nothing.
#
# Effort uses one vocabulary too: low, medium, high, xhigh, max. Every level
# now maps to a real setting on Claude Code and Codex; Codex previously clamped
# max onto xhigh, but max is a real Codex level on every GPT-6 model, Luna
# included. Codex also has an "ultra" level above max, which this vocabulary
# deliberately does not expose: it fans work out to subagents rather than
# reasoning harder, Luna rejects it, and neither other provider has an
# equivalent, so a portable agent config set to ultra would break elsewhere.
#
# Gemini CLI has no per-invocation thinking control: its thinking level lives
# only in settings.json model configs. The option is declared but inert there,
# which keeps a portable agent config from failing to load under Gemini.
#
# There is deliberately NO speed/fast-mode option. No CLI among the three
# exposes one: Claude Code has no --fast flag, Codex expresses speed only
# through model choice, Gemini likewise. A declared-but-inert speed option
# would look like a control and silently do nothing, so it is left out until
# a provider gives it a real surface.

# ── claude ─────────────────────────────────────────
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
options_schema_merge = "by_key"
option_defaults = { model = "operator", effort = "medium" }

# model: four portable tiers, then passthrough values for the same models,
# so a city can pin an exact model. Only the models the tiers use are listed;
# superseded and retired models are deliberately left out.
[[providers.claude.options_schema]]
key = "model"
label = "Model tier"
type = "select"
default = "operator"

[[providers.claude.options_schema.choices]]
value = "principal"
label = "Principal"
flag_args = ["--model", "claude-fable-5-2"]

[[providers.claude.options_schema.choices]]
value = "engineer"
label = "Engineer"
flag_args = ["--model", "claude-opus-5-5"]

[[providers.claude.options_schema.choices]]
value = "operator"
label = "Operator"
flag_args = ["--model", "claude-sonnet-5-5"]

[[providers.claude.options_schema.choices]]
value = "custodian"
label = "Custodian"
flag_args = ["--model", "claude-haiku-5-5"]

# passthrough: pin an exact model instead of a tier

[[providers.claude.options_schema.choices]]
value = "fable-5-2"
label = "Fable 5.2"
flag_args = ["--model", "claude-fable-5-2"]

[[providers.claude.options_schema.choices]]
value = "opus-5-5"
label = "Opus 5.5"
flag_args = ["--model", "claude-opus-5-5"]

[[providers.claude.options_schema.choices]]
value = "sonnet-5-5"
label = "Sonnet 5.5"
flag_args = ["--model", "claude-sonnet-5-5"]

[[providers.claude.options_schema.choices]]
value = "haiku-5-5"
label = "Haiku 5.5"
flag_args = ["--model", "claude-haiku-5-5"]

[[providers.claude.options_schema]]
key = "effort"
label = "Effort"
type = "select"
default = "medium"

[[providers.claude.options_schema.choices]]
value = "low"
label = "Low"
flag_args = ["--effort", "low"]

[[providers.claude.options_schema.choices]]
value = "medium"
label = "Medium"
flag_args = ["--effort", "medium"]

[[providers.claude.options_schema.choices]]
value = "high"
label = "High"
flag_args = ["--effort", "high"]

[[providers.claude.options_schema.choices]]
value = "xhigh"
label = "Xhigh"
flag_args = ["--effort", "xhigh"]

[[providers.claude.options_schema.choices]]
value = "max"
label = "Max"
flag_args = ["--effort", "max"]

